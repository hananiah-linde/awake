name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: hananiah-linde/homebrew-tap/.github/workflows/release-macos-app.yml@main
    permissions:
      contents: write
    with:
      app-name: Awake
    secrets:
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}

  cask:
    needs: release
    uses: hananiah-linde/homebrew-tap/.github/workflows/bump-cask.yml@main
    with:
      cask: awake
      version: ${{ needs.release.outputs.version }}
      sha256: ${{ needs.release.outputs.sha256 }}
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
